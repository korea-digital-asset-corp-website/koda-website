name: Security Audit Daily

# PR 게이트(security-audit.yaml)와 별개로, 매일 정기 스캔해 HIGH+ 신규 취약점을
# 슬랙(#noti_security_audit)에 척척(chuk-chuk) 멘션으로 올린다. 척척이 각 advisory를
# fetch·분석해 "런타임 조치 필요 여부"를 스레드에 답한다. (자동 fix/PR 은 하지 않음)
#
# dedup: 이전 실행에서 알린 HIGH+ 집합을 actions/cache 에 저장해, **신규 advisory 만** 알린다.
#   (매 실행 unique key 로 저장 + restore-keys 접두사로 직전 것을 복원. 캐시 evict 시 그날 1회 재알림.)
#
# 게시는 devops 슬랙 앱 봇 토큰 + chat.postMessage 로 한다(발신자가 척척이가 아니어야
# app_mention 이 발사됨 — devops 봇은 척척이와 다른 앱이라 정상 트리거).
# 토큰은 GCP Secret Manager(prj-t-cicd / DEVOPS_SLACKAPP_OAUTH_TOKEN)에 있고,
# 배포에 쓰는 WIF(WIF_PROVIDER/WIF_SA)로 인증해 런타임에 꺼내온다.
#
# 사전 준비(1회):
#   0) 이 레포에 WIF_PROVIDER / WIF_SA secrets 설정. 웹사이트는 별도 GitHub org이므로
#      WIF provider 조건과 service account IAM이 이 레포의 OIDC identity를 허용해야 한다.
#   1) devops 봇을 #noti_security_audit(C0C1HCNFHGW) 채널에 초대
#   2) WIF_SA 에 그 secret 접근 권한 부여(안 하면 발송 스텝이 실패):
#      gcloud secrets add-iam-policy-binding DEVOPS_SLACKAPP_OAUTH_TOKEN --project prj-t-cicd \
#        --member="serviceAccount:<WIF_SA>" --role="roles/secretmanager.secretAccessor"
#   3) 척척 ConfigMap allowed-channel-ids 에 C0C1HCNFHGW 추가 (완료)
#
# 발송 경로 검증: Actions 에서 이 워크플로우를 workflow_dispatch 로 열고 test_send=true 로
# 실행하면, 감사 결과와 무관하게 테스트 알림 1건을 실제 발송한다(WIF_SA 접근까지 한 번에 검증).

on:
  schedule:
    - cron: '0 0 * * 1-5' # 매일 UTC 00:00 = KST 09:00, 평일만
  workflow_dispatch:
    inputs:
      test_send:
        description: '테스트 알림 1건을 강제 발송(감사 결과 무시) — 발송 경로/권한 검증용'
        type: boolean
        default: false

concurrency:
  group: security-audit-daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit-notify:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # WIF(google-github-actions/auth) 에 필요
    strategy:
      matrix:
        node-version: ['20']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --ignore-scripts

      # 이전 실행에서 알린 HIGH+ 집합 복원. key 는 매 실행 unique(항상 새로 저장) +
      # restore-keys 접두사로 직전 것을 가져온다. 첫 실행/evict 시엔 miss → 빈 집합.
      - name: Restore known advisories (dedup state)
        if: ${{ !inputs.test_send }}
        uses: actions/cache@v4
        with:
          path: security-audit-known.json
          key: sec-audit-known-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sec-audit-known-

      - name: Audit prod deps → build Slack payload (신규 HIGH+ 만)
        id: audit
        if: ${{ !inputs.test_send }}
        env:
          CHUKCHUK_USER_ID: U0BMD5G277D
        run: |
          # npm audit 는 취약점 발견 시 non-zero 로 종료하므로 실패로 처리하지 않는다.
          npm audit --omit=dev --json > audit.json || true
          node .github/scripts/security-audit-slack.mjs audit.json security-audit-known.json > slack-payload.json
          if [ -s slack-payload.json ]; then
            echo "has=1" >> "$GITHUB_OUTPUT"
          else
            echo "has=0" >> "$GITHUB_OUTPUT"
          fi

      # test_send=true 면 감사 결과를 무시하고 테스트 payload 로 덮어써 강제 발송한다.
      - name: Build test payload (test_send)
        id: test
        if: github.event_name == 'workflow_dispatch' && inputs.test_send
        env:
          CHUKCHUK_USER_ID: U0BMD5G277D
        run: |
          node -e "const u=process.env.CHUKCHUK_USER_ID; const text='['+process.env.GITHUB_REPOSITORY+'] <@'+u+'> :test_tube: [테스트] 보안 감사 발송 경로 점검 — 아래 advisory 런타임 조치 필요 여부 분석해줘\n• *js-yaml* (high): https://github.com/advisories/GHSA-724g-mxrg-4qvm'; require('fs').writeFileSync('slack-payload.json', JSON.stringify({text}));"
          echo "has=1" >> "$GITHUB_OUTPUT"

      # 발송 여부: 신규 HIGH+ 가 있거나(test_send 로 payload 를 강제로 만들었거나)
      - name: Resolve send flag
        id: send
        run: |
          if [ "${{ steps.test.outputs.has }}" = "1" ] || [ "${{ steps.audit.outputs.has }}" = "1" ]; then
            echo "go=1" >> "$GITHUB_OUTPUT"
          else
            echo "go=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to GCP (WIF)
        if: steps.send.outputs.go == '1'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA }}

      # devops 봇 토큰을 Secret Manager 에서 꺼낸다(자동 마스킹됨).
      - name: Fetch devops Slack bot token
        id: sm
        if: steps.send.outputs.go == '1'
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets: |-
            slack_token:prj-t-cicd/DEVOPS_SLACKAPP_OAUTH_TOKEN

      - name: Notify 척척 in Slack (chat.postMessage)
        if: steps.send.outputs.go == '1'
        env:
          SLACK_BOT_TOKEN: ${{ steps.sm.outputs.slack_token }}
          SLACK_CHANNEL_ID: C0C1HCNFHGW
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ]; then
            echo "::error::Secret Manager 에서 토큰을 못 가져왔습니다. WIF_SA 에 secretmanager.secretAccessor 부여 확인."
            exit 1
          fi
          # slack-payload.json({text}) 에 channel 을 붙여 chat.postMessage payload 구성 (node 로 안전하게)
          node -e "const p=require('./slack-payload.json'); process.stdout.write(JSON.stringify({channel:process.env.SLACK_CHANNEL_ID, text:p.text}))" > post.json
          RESP=$(curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H 'Content-type: application/json; charset=utf-8' \
            --data @post.json)
          echo "$RESP"
          # chat.postMessage 는 실패해도 HTTP 200 + {ok:false} 이므로 ok 필드로 판정한다.
          node -e "process.exit(JSON.parse(process.argv[1]).ok ? 0 : 1)" "$RESP" || {
            echo "::error::Slack chat.postMessage 실패 — 봇이 채널 멤버인지/스코프(chat:write) 확인: $RESP"
            exit 1
          }
